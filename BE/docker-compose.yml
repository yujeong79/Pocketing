version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: local_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pocketing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ssafy
    volumes:
      - local_pgdata:/var/lib/postgresql/data

volumes:
  local_pgdata: